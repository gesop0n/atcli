name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust ツールチェーンを用意する
        run: |
          rustup toolchain install --profile minimal --component rustfmt,clippy
          rustup default "$(rustup toolchain list | head -1 | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # commit サブコマンドのテストは git を使う。コンパイラは呼ばない。
      - run: cargo test --workspace

  nix:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest は x86_64-linux、macos-latest は aarch64-darwin。
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # flake が「対応している」と主張する system すべてを評価する。他 system の
      # derivation はこのランナーではビルドできないので --no-build が要る。
      - run: nix flake check --all-systems --no-build

      # ランナー自身の system だけ、実際にビルドしてテストまで通す。
      - run: nix flake check
