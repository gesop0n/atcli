[package]
name = "atcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A small local workflow tool for solving AtCoder problems"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
owo-colors = "4.2"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "brotli",
  "deflate",
  "gzip",
  "rustls-tls",
] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
similar = "2.7"
toml = "0.8"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
